name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The workflow token is read-only, so findings are reported in the job log, not as PR comments.
          GITLEAKS_ENABLE_COMMENTS: false

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test ./...
      - name: Check for known vulnerabilities
        # Windows too, since the GUI and its dependencies only build there.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          GOOS=windows govulncheck ./...
      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Same resources as the release build, so the packaged exe can start.
      - name: Embed manifest and icon
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in cmd/pdf-unseal/winres/winres.json --out cmd/pdf-unseal/rsrc --arch amd64
      - name: Build exe
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o pdf-unseal.exe ./cmd/pdf-unseal
      # Any version the Store accepts; the first part cannot be 0.
      - name: Build MSIX
        run: ./scripts/build-msix.ps1 -Exe pdf-unseal.exe -Version 1.0.0 -Out pdf-unseal.msix

  screenshots:
    uses: ./.github/workflows/screenshots.yml
    with:
      retention-days: 1
